<section id="fab-loader-fragment">
  <strong>Mounted HTML</strong>
  <picture>
    <source
      id="fab-loader-relative-srcset"
      media="(max-width: 1px)"
      srcset="./relative-a.svg 1x,./relative-b.svg 2x, data:image/svg+xml,%3Csvg%3E%3C/svg%3E 3x"
    >
  </picture>
  <form>
    <button
      id="fab-loader-relative-formaction"
      type="submit"
      formaction="./submit/action"
    >Submit</button>
  </form>
  <object
    id="fab-loader-relative-object"
    data="./relative-object.bin"
    type="application/octet-stream"
  ></object>
  <span
    id="fab-loader-relative-style"
    style="background-image: url('./relative-background.svg')"
  ></span>
  <script>
    window.fabLoaderMountOrder = ['inline-first'];
  </script>
  <script src="./fab-loader-mounted-script.js"></script>
  <script>
    window.fabLoaderMountOrder.push('inline-last');
    document.getElementById('fab-loader-fragment')
      .setAttribute('data-script-ready', 'true');
  </script>
</section>
