<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FabGrid Dev Grid Demo</title>
    <link rel="stylesheet" href="../src/fabui.css?v=20260805-cell-maker-link-v1" />
    <script src="./js/theme-loader.js?v=20260731-tree-icons-v1"></script>
    <link
      rel="stylesheet"
      href="./style/my.icon.css?v=20260713-demo-style-folder-v1"
    />
    <link
      rel="stylesheet"
      href="./style/style.css?v=20260719-style-isolation-v1"
    />
    <link
      rel="stylesheet"
      href="./style/grid2.css?v=20260727-column-css-class-v1"
    />
  </head>
  <body
    class="fg-theme-default grid2-demo"
    data-grid-toolbar-icon-only="true"
  >
    <main class="page">
      <section
        data-fabgrid-demo-toolbar
        data-selection-range-toggle="true"
        data-edit-mode-toggle="true"
      ></section>

      <section class="stats" aria-label="FabGrid stats">
        <span id="rowCount">Rows: -</span>
        <span id="rowRange">Rows visible: -</span>
        <span id="columnRange">Columns visible: -</span>
        <span id="cellCount">Rendered cells: -</span>
      </section>

      <section class="grid-shell">
        <div id="grid"></div>
        <div class="demo-filter-bar" aria-label="Demo filter">
          <span id="demoResultCount" class="demo-result-count">筆數: -</span>
          <label class="demo-filter-control">
            <span id="demoFilterLabel">篩選:</span>
            <span class="demo-filter-input-wrap">
              <input
                id="demoFilterInput"
                type="search"
                placeholder="輸入條件"
                autocomplete="off"
              />
              <a data-fabui-button href="javascript:void(0)"
                id="demoFilterMode"
                class="demo-filter-mode"
                aria-label="OR"
                title="OR"
              >
                OR
              </a>
              <a data-fabui-button href="javascript:void(0)"
                id="demoFilterClear"
                aria-label="清除篩選"
                title="清除篩選"
              >
                🧹
              </a>
            </span>
          </label>
        </div>
      </section>
    </main>

    <script src="./js/grid-toolbar.js?v=20260728-edit-mode-toggle-v2"></script>
    <script src="./js/grid-data.js?v=20260721-initial-filter-rules-v1"></script>
    <script src="./js/grid-locales.js?v=20260728-edit-mode-toggle-v2"></script>
    <script src="./js/grid-query.js?v=20260722-remote-op-symbol-v1"></script>
    <script type="module">
      import fabui from "../src/fabui.js?v=20260805-grid-pivot-audit-fixes-v1";
      import { createGrid2FabuiDemo } from "./js/grid2-components.js?v=20260728-edit-mode-toggle-v2";

      window.fabui = fabui;
      window.FABUI_DEMO_LOCALE_BASE_URL = "../src/locales/";
      window.FABGRID_DEMO_HEADER_GROUPS = true;
      const grid2Components = createGrid2FabuiDemo(fabui);

      await import("./js/grid.js?v=20260804-grid-column-rollback-v4");
      grid2Components.complete();
    </script>
    <script type="module" src="./js/dev-controls.js?v=20260721-initial-filter-rules-v1"></script>
</body>
</html>
